openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Techpack Solutions API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chatbot operations
  - name: leads
    description: Lead capture operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat:
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a chat message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error

  /leads:
    post:
      operationId: captureLead
      tags: [leads]
      summary: Capture a customer lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead captured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error

    get:
      operationId: getLeads
      tags: [leads]
      summary: Get all captured leads
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChatMessageInput:
      type: object
      required:
        - message
        - conversationHistory
      properties:
        message:
          type: string
          description: The user's message
        conversationHistory:
          type: array
          description: Previous messages in the conversation
          items:
            $ref: "#/components/schemas/ConversationMessage"

    ConversationMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    ChatResponse:
      type: object
      required:
        - reply
      properties:
        reply:
          type: string
          description: AI assistant reply

    LeadInput:
      type: object
      required:
        - name
        - phone
        - location
      properties:
        name:
          type: string
        phone:
          type: string
        location:
          type: string
        notes:
          type: ["string", "null"]

    Lead:
      type: object
      required:
        - id
        - name
        - phone
        - location
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        location:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
